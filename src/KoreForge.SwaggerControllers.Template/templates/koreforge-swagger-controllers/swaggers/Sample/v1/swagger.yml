swagger: "2.0"
info:
  title: Sample API
  version: "1.0"
basePath: /sample/v1
consumes:
  - application/json
produces:
  - application/json
paths:
  /widgets:
    get:
      operationId: SampleListWidgets
      summary: List widgets.
      parameters:
        - name: pageSize
          in: query
          required: false
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          schema:
            type: array
            items:
              $ref: "#/definitions/Widget"
    post:
      operationId: SampleCreateWidget
      summary: Create a widget.
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/WidgetRequest"
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/Widget"
  /widgets/{id}:
    get:
      operationId: SampleGetWidget
      summary: Fetch a widget by id.
      parameters:
        - name: id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/Widget"
definitions:
  Widget:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
      name:
        type: string
      description:
        type: string
  WidgetRequest:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      description:
        type: string
